version: '3'

services:
  web:
    build:
      context: .
      dockerfile: nginx-uwsgi/Dockerfile_uwsgi
    volumes:
      - .:/code
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      # activate the mailer backend
      EMAIL_BACKEND: mailer
      # path to the collected static
      STATIC_ROOT: /var/pytition/static
      # base image defaults to UWSGI_PROCESSES=16 / UWSGI_CHEAPER=2, which
      # override nginx-uwsgi/uwsgi.ini's "processes = 1" — pin both to 1
      # worker explicitly so the ini setting is actually respected
      UWSGI_PROCESSES: 1
      # cheaper (dynamic scaling minimum) must be < processes; 0 disables it
      # so we get a fixed single worker instead of the base image's default
      # dynamic range (16 max / 2 min)
      UWSGI_CHEAPER: 0
