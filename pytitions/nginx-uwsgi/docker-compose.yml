version: '3'

services:
  web:
    build:
      context: .
      dockerfile: nginx-uwsgi/Dockerfile_uwsgi
    volumes:
      - .:/code
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      # activate the mailer backend
      EMAIL_BACKEND: mailer
      # path to the collected static
      STATIC_ROOT: /var/pytition/static
      # base image defaults to UWSGI_PROCESSES=16 / UWSGI_CHEAPER=2, which
      # override nginx-uwsgi/uwsgi.ini's "processes = 32" — pin both explicitly
      # so the ini setting is actually respected
      UWSGI_PROCESSES: ${UWSGI_PROCESSES:-32}
      # cheaper = workers always running (must be < processes; 0 disables it).
      # The other workers (up to UWSGI_PROCESSES) start under load and stop when idle
      UWSGI_CHEAPER: ${UWSGI_CHEAPER:-4}
      # size of the uWSGI socket backlog (base image default: 100). Capped by
      # the kernel's net.core.somaxconn
      UWSGI_LISTEN: ${UWSGI_LISTEN:-1024}
