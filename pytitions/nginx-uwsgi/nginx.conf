user  nginx;
worker_processes 1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Data minimisation: truncated client IP (IPv4 /24, IPv6 /48), no X-Forwarded-For,
    # and no access log for URLs carrying personal tokens (signature confirmation and management links).
    # Regexes are quoted, the first match wins. Compressed IPv6 ("::") are
    # handled when "::" falls inside the first three groups (2001:db8::1 -> 2001:db8::).
    map $remote_addr $remote_addr_anon {
        "~^(?:::ffff:)?(?P<ip>\d+\.\d+\.\d+)\.\d+$"              $ip.0;
        "~*^(?P<ip>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"     $ip::;
        "~*^(?P<ip>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                  $ip::;
        "~*^(?P<ip>[0-9a-f]{1,4})::"                                $ip::;
        "~^::"                                                      ::;
        default                                                     0.0.0.0;
    }
    map $request_uri $loggable {
        "~/confirm/"                                                0;
        "~/signature/manage/"                                       0;
        default                                                     1;
    }
    log_format  main  '$remote_addr_anon - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main  if=$loggable;
    sendfile        on;
    keepalive_timeout  65;

    # uwsgi for pytition
    server {
        listen 80;
        location /static {
            alias /var/pytition/static;
        }
        location / {
            include uwsgi_params;
            uwsgi_pass unix:///tmp/uwsgi.sock;
        }
    }

}
daemon off;
