[project]
name = "Pytition"
version = "2.8.1"
description = "Django app for self-hosted privacy-friendly online petitions"
authors = [
    {name = "Yann Sionneau", email = "yann@sionneau.net"},
]
dependencies = [
    "Django>=4.2,<5.3",
    "django-colorfield",
    "django-tinymce",
    "django-mailer",
    "django-maintenance-mode",
    "django-phonenumber-field[phonenumbers]",
    "requests",
    "django-widget-tweaks",
    "beautifulsoup4",
    "django-formtools",
    "bcrypt",
    "lxml[html_clean]",
    "uwsgi",
    "jinja2",
    "psycopg[binary]>=3.1.19",
    "matplotlib>=3.7.5",
    "python-akismet>=0.4.3",
    "alt-profanity-check>=1.3.2",
    "setuptools>=75.3.2,<81",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "BSD 3-Clause"}


[tool.pdm]
distribution = false

[tool.pdm.dev-dependencies]
test = [
    "coverage==4.5.2",
    "sphinx",
    "sphinx-rtd-theme"
]

[dependency-groups]
test = ["coverage==4.5.2", "sphinx", "sphinx-rtd-theme"]
