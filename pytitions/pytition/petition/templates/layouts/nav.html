{% load i18n %}
{% load static %}
{% with current=request.resolver_match.url_name %}
<header class="fp-header">
  <div class="fp-container{% if fluid %} fp-container-fluid{% endif %} fp-header-bar">
    <a class="fp-brand" href="{% url 'index' %}">
      <img alt="" height="40" width="40" src="{% static "img/framapetitions.png" %}">
      <span><span class="fp-brand-frama">Frama</span><span class="fp-brand-product">petitions</span></span>
    </a>
    <button type="button" class="fp-nav-link fp-header-toggle" data-fp-menu-toggle aria-expanded="false" aria-controls="fp-header-menu">
      {% include "components/icon.html" with name="menu" %}
      {% trans "Menu" %}
    </button>
    <div class="fp-header-menu" id="fp-header-menu">
      <nav aria-label="{% trans "Main navigation" %}">
        <ul class="fp-nav-list">
          <li><a class="fp-nav-link" href="{% url 'index' %}"{% if current == "index" %} aria-current="page"{% endif %}>{% trans "Petitions" %}</a></li>
        </ul>
      </nav>
      <form class="fp-header-search" role="search" action="{% url 'search' %}" method="GET">
        <label for="fp-search" class="sr-only">{% trans "Search for petition" %}</label>
        <div class="fp-input-group">
          <input type="search" id="fp-search" class="fp-input" placeholder="{% trans "Search for petition" %}" name="q" value="{{ q }}">
          <button type="submit" class="fp-btn fp-btn-secondary fp-btn-icon">
            {% include "components/icon.html" with name="magnifying-glass" %}
            <span class="fp-sr-only">{% trans "Search" %}</span>
          </button>
        </div>
      </form>
      {% include 'layouts/nav-useractions.html' %}
    </div>
  </div>
</header>
{% endwith %}
