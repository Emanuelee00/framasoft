# Render Blueprint: Render > New > Blueprint, then pick this repository.
# Free plan: the web service sleeps after 15 minutes without traffic (the first request wakes
# it up in about a minute) and the free Postgres database expires after 30 days.
databases:
  - name: pytition-db
    plan: free
    region: frankfurt
    databaseName: pytition
    user: pytition

services:
  - type: web
    name: pytition
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./pytitions/nginx-uwsgi/Dockerfile_render
    dockerContext: ./pytitions
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pytition-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SIGNATURE_IP_HMAC_KEY
        generateValue: true
      # The free plan has 512 MB of RAM: few uWSGI workers (one always on, one on demand)
      - key: UWSGI_PROCESSES
        value: "2"
      - key: UWSGI_CHEAPER
        value: "1"
      # Admin account for /admin/, created at start (the free plan has no shell).
      # Render asks for these three values when the Blueprint is created.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
